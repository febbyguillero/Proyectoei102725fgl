<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editar Usuario OVI - SgOVI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{fragments/navbar-tecnico :: navbar-tecnico}"></nav>

<main class="container mt-4">
  <h1>Editar Usuario</h1>

  <form th:action="@{/usuario/update}" th:object="${usuario}" method="post">
    <input type="hidden" th:field="*{idUsuari}" />

    <div class="mb-3">
      <label for="identificadorSgovi" class="form-label">Identificador SGOVID:</label>
      <input type="text" class="form-control" id="identificadorSgovi" th:field="*{identificadorSgovi}" required />
    </div>

    <div class="mb-3">
      <label for="contrasenya" class="form-label">Nueva contraseña:</label>
      <input type="password" class="form-control" id="contrasenya" th:field="*{contrasenya}"
             autocomplete="new-password" aria-describedby="ayudaContrasenya" />
      <div id="ayudaContrasenya" class="form-text">
        Déjalo en blanco para mantener la contraseña actual. Solo se cambia si escribes una nueva.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input type="email" class="form-control" id="email" th:field="*{email}" required />
    </div>

    <div class="mb-3">
      <label for="nom" class="form-label">Nombre:</label>
      <input type="text" class="form-control" id="nom" th:field="*{nom}" required />
    </div>

    <div class="mb-3">
      <label for="cognoms" class="form-label">Apellidos:</label>
      <input type="text" class="form-control" id="cognoms" th:field="*{cognoms}" required />
    </div>

    <div class="mb-3">
      <label for="dni" class="form-label">DNI:</label>
      <input type="text" class="form-control" id="dni" th:field="*{dni}" required
             pattern="[0-9]{8}[A-Za-z]" title="DNI: 8 números seguidos de una letra" />
    </div>

    <div class="mb-3">
      <label for="telefon" class="form-label">Teléfono:</label>
      <input type="text" class="form-control" id="telefon" th:field="*{telefon}"
             pattern="[0-9]{9}" title="Teléfono: 9 dígitos" />
    </div>

    <div class="mb-3">
      <label for="dataNaixement" class="form-label">Fecha de Nacimiento:</label>
      <input type="date" class="form-control" id="dataNaixement" th:field="*{dataNaixement}" />
    </div>

    <div class="mb-3">
      <label for="adreca" class="form-label">Dirección:</label>
      <textarea class="form-control" id="adreca" th:field="*{adreca}" rows="2"></textarea>
    </div>

    <div class="mb-3">
      <label for="zonaGeografica" class="form-label">Zona geográfica:</label>
      <input type="text" class="form-control" id="zonaGeografica" th:field="*{zonaGeografica}" />
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="consentimentInformat" th:field="*{consentimentInformat}" />
      <label class="form-check-label" for="consentimentInformat">Consentimiento informado</label>
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="estatTecnicAcceptat" th:field="*{estatTecnicAcceptat}" />
      <label class="form-check-label" for="estatTecnicAcceptat">Usuario aceptado por el técnico</label>
    </div>

    <h2 class="h5">Tutor Legal (solo para menores)</h2>

    <div class="mb-3">
      <label for="tutorLegalNom" class="form-label">Nombre del Tutor:</label>
      <input type="text" class="form-control" id="tutorLegalNom" th:field="*{tutorLegalNom}" />
    </div>

    <div class="mb-3">
      <label for="tutorLegalContacte" class="form-label">Contacto del Tutor:</label>
      <input type="text" class="form-control" id="tutorLegalContacte" th:field="*{tutorLegalContacte}" />
    </div>

    <input type="hidden" th:field="*{dataRegistre}" />

    <button type="submit" class="btn btn-primary">Actualizar</button>
    <a th:href="@{/tecnico/usuarios-pendientes}" class="btn btn-secondary">Cancelar</a>
  </form>
</main>
</body>
</html>
