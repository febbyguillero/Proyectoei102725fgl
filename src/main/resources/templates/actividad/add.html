<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Activitat - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Nova activitat de formació o divulgació</h1>

<form th:action="@{/actividad/add}" th:object="${actividad}" method="post" style="max-width:700px">
    <div class="mb-3">
        <label for="titulo" class="form-label">Títol <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="titulo" th:field="*{titulo}" required>
        <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
    </div>
    <div class="mb-3">
        <label for="descripcion" class="form-label">Descripció</label>
        <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label for="tipoActividad" class="form-label">Tipus <span class="text-danger">*</span></label>
        <select class="form-select" id="tipoActividad" th:field="*{tipoActividad}" required>
            <option value="">Selecciona...</option>
            <option value="FORMACION">Formació (amb inscripció, aforament limitat)</option>
            <option value="DIVULGACION">Divulgació (oberta al públic, sense inscripció)</option>
        </select>
        <div class="text-danger small" th:if="${#fields.hasErrors('tipoActividad')}" th:errors="*{tipoActividad}"></div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label for="fechaInicio" class="form-label">Data i hora d'inici</label>
            <input type="datetime-local" class="form-control" id="fechaInicio" th:field="*{fechaInicio}">
        </div>
        <div class="col-md-6">
            <label for="fechaFin" class="form-label">Data i hora de fi</label>
            <input type="datetime-local" class="form-control" id="fechaFin" th:field="*{fechaFin}">
        </div>
    </div>
    <div class="mb-3">
        <label for="lugar" class="form-label">Lloc</label>
        <input type="text" class="form-control" id="lugar" th:field="*{lugar}">
    </div>
    <div class="mb-3">
        <label for="aforoMaximo" class="form-label">Aforament màxim (només formació)</label>
        <input type="number" class="form-control" id="aforoMaximo" th:field="*{aforoMaximo}" min="1">
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/actividad/list" class="btn btn-outline-secondary">Cancel·lar</a>
    </div>
</form>
</body>
</html>
