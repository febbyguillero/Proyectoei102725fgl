<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Activitat - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar-tecnico :: navbar-tecnico}"></nav>
<main class="container mt-4" style="max-width:700px">
    <h1>Editar activitat #<span th:text="${actividad.idActividad}"></span></h1>

    <form th:action="@{/actividad/update}" th:object="${actividad}" method="post">
        <input type="hidden" th:field="*{idActividad}">
        <div class="mb-3">
            <label for="titulo" class="form-label">Títol <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="titulo" th:field="*{titulo}" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripció</label>
            <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="tipoActividad" class="form-label">Tipus</label>
            <select class="form-select" id="tipoActividad" th:field="*{tipoActividad}">
                <option value="FORMACION">Formació</option>
                <option value="DIVULGACION">Divulgació</option>
            </select>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="fechaInicio" class="form-label">Data i hora d'inici</label>
                <input type="datetime-local" class="form-control" id="fechaInicio" th:field="*{fechaInicio}">
            </div>
            <div class="col-md-6">
                <label for="fechaFin" class="form-label">Data i hora de fi</label>
                <input type="datetime-local" class="form-control" id="fechaFin" th:field="*{fechaFin}">
            </div>
        </div>
        <div class="mb-3">
            <label for="lugar" class="form-label">Lloc</label>
            <input type="text" class="form-control" id="lugar" th:field="*{lugar}">
        </div>
        <div class="mb-3">
            <label for="aforoMaximo" class="form-label">Aforament màxim</label>
            <input type="number" class="form-control" id="aforoMaximo" th:field="*{aforoMaximo}" min="1">
        </div>
        <div class="mb-3">
            <label for="estado" class="form-label">Estat</label>
            <select class="form-select" id="estado" th:field="*{estado}">
                <option value="programada">Programada</option>
                <option value="activa">Activa</option>
                <option value="finalizada">Finalitzada</option>
                <option value="cancelada">Cancel·lada</option>
            </select>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar canvis</button>
            <a th:href="@{/actividad/list}" class="btn btn-outline-secondary">Cancel·lar</a>
        </div>
    </form>
</main>
</body>
</html>
