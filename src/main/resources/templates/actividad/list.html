<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activitats de Formació - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container mt-4">
<h1>Activitats de Formació i Divulgació</h1>

<div class="d-flex gap-2 mb-3">
    <a th:href="@{/actividad/add}" class="btn btn-primary">+ Nova activitat</a>
    <a th:href="@{/tecnico/panel}" class="btn btn-outline-secondary">Tornar al panel</a>
</div>

<form method="get" th:action="@{/actividad/list}" class="row g-2 mb-3" role="search">
    <input type="hidden" name="sort" th:value="${sort}">
    <input type="hidden" name="dir" th:value="${dir}">
    <div class="col-md-8">
        <label for="q" class="visually-hidden">Cercar per títol, tipus o lloc</label>
        <input type="text" id="q" name="q" th:value="${q}" class="form-control"
               placeholder="Cercar per títol, tipus o lloc...">
    </div>
    <div class="col-md-4">
        <button type="submit" class="btn btn-primary">Cercar</button>
        <a th:href="@{/actividad/list}" class="btn btn-outline-secondary">Netejar</a>
    </div>
</form>

<p class="text-muted" th:text="${total} + ' activitat(s)'">0</p>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/actividad/list(q=${q}, sort='id', dir=${sort == 'id' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                ID <span th:if="${sort == 'id'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'id'}">↕</span>
            </a>
        </th>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/actividad/list(q=${q}, sort='titulo', dir=${sort == 'titulo' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                Títol <span th:if="${sort == 'titulo'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'titulo'}">↕</span>
            </a>
        </th>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/actividad/list(q=${q}, sort='tipo', dir=${sort == 'tipo' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                Tipus <span th:if="${sort == 'tipo'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'tipo'}">↕</span>
            </a>
        </th>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/actividad/list(q=${q}, sort='inicio', dir=${sort == 'inicio' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                Inici <span th:if="${sort == 'inicio'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'inicio'}">↕</span>
            </a>
        </th>
        <th scope="col">Lloc</th>
        <th scope="col">Aforament</th>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/actividad/list(q=${q}, sort='estado', dir=${sort == 'estado' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                Estat <span th:if="${sort == 'estado'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'estado'}">↕</span>
            </a>
        </th>
        <th scope="col">Accions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="a : ${actividades}">
        <td th:text="${a.idActividad}"></td>
        <td th:text="${a.titulo}"></td>
        <td>
            <span th:if="${a.tipoActividad == 'FORMACION'}" class="badge bg-primary">Formació</span>
            <span th:if="${a.tipoActividad == 'DIVULGACION'}" class="badge bg-info text-dark">Divulgació</span>
            <span th:unless="${a.tipoActividad == 'FORMACION' or a.tipoActividad == 'DIVULGACION'}"
                  class="badge bg-secondary" th:text="${a.tipoActividad}"></span>
        </td>
        <td th:text="${#temporals.format(a.fechaInicio, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${a.lugar}"></td>
        <td th:text="${a.aforoMaximo != null ? a.aforoMaximo : 'Lliure'}"></td>
        <td>
            <span th:switch="${a.estado}">
                <span th:case="'programada'" class="badge bg-warning text-dark">Programada</span>
                <span th:case="'finalizada'" class="badge bg-secondary">Finalitzada</span>
                <span th:case="'cancelada'" class="badge bg-danger">Cancel·lada</span>
                <span th:case="*" class="badge bg-secondary" th:text="${a.estado}"></span>
            </span>
        </td>
        <td>
            <a th:href="@{/actividad/update/{id}(id=${a.idActividad})}" class="btn btn-sm btn-warning">Editar</a>
            <a th:href="@{/actividad/delete/{id}(id=${a.idActividad})}" class="btn btn-sm btn-danger">Eliminar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(actividades)}">
        <td colspan="8" class="text-center text-muted">No hi ha activitats que coincidisquen.</td>
    </tr>
    </tbody>
</table>

<nav th:if="${totalPaginas > 1}" aria-label="Paginació">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
            <a class="page-link" th:href="@{/actividad/list(q=${q}, sort=${sort}, dir=${dir}, page=${page - 1})}" aria-label="Página anterior">«</a>
        </li>
        <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPaginas)}" th:classappend="${p == page} ? 'active'">
            <a class="page-link" th:href="@{/actividad/list(q=${q}, sort=${sort}, dir=${dir}, page=${p})}" th:text="${p}"></a>
        </li>
        <li class="page-item" th:classappend="${page == totalPaginas} ? 'disabled'">
            <a class="page-link" th:href="@{/actividad/list(q=${q}, sort=${sort}, dir=${dir}, page=${page + 1})}" aria-label="Página siguiente">»</a>
        </li>
    </ul>
</nav>

</main>
</body>
</html>
