<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Les meues sol·licituds - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">SgOVI</span>
    <div>
        <a href="/solicitudes/mi-perfil" class="btn btn-outline-light btn-sm me-2">El meu perfil</a>
        <a href="/solicitudes/mis-contratos" class="btn btn-outline-light btn-sm me-2">Els meus contractes</a>
        <span class="text-light me-3 small" th:text="'Hola, ' + ${session.nombreUsuario}"></span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Sortir</a>
    </div>
</nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Les meues sol·licituds</h1>
        <a href="/solicitudes/nueva" class="btn btn-primary">+ Nova sol·licitud</a>
    </div>

    <div th:if="${missatgeOk}" class="alert alert-success" th:text="${missatgeOk}"></div>

    <!-- Buscador -->
    <form method="get" th:action="@{/solicitudes/mis-solicitudes}" class="row g-2 mb-3" role="search">
        <input type="hidden" name="dir" th:value="${dir}">
        <div class="col-md-8">
            <label for="q" class="visually-hidden">Cercar per tipus, estat o dies</label>
            <input type="text" id="q" name="q" th:value="${q}" class="form-control"
                   placeholder="Cercar per PAP, PATI, PENDIENTE, APROBADA...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Cercar</button>
            <a th:href="@{/solicitudes/mis-solicitudes}" class="btn btn-outline-secondary">Netejar</a>
        </div>
    </form>

    <p class="text-muted small" th:text="${total} + ' sol·licitud(s)'"></p>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>
                <a class="link-light text-decoration-none"
                   th:href="@{/solicitudes/mis-solicitudes(q=${q}, dir=${dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    Data <span th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>Tipus</th>
            <th>Dies</th>
            <th>Franja</th>
            <th>Estat</th>
            <th>Acció</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sol : ${solicitudes}">
            <td th:text="${sol.dataCreacio}"></td>
            <td th:text="${sol.tipusServei}"></td>
            <td th:text="${sol.dies != null and !sol.dies.isEmpty() ? sol.dies : '—'}"></td>
            <td th:text="${sol.franjaHoraria != null ? sol.franjaHoraria : '—'}"></td>
            <td>
                <span th:switch="${sol.estat}">
                    <span th:case="'PENDIENTE'" class="badge bg-warning text-dark">En revisió</span>
                    <span th:case="'APROBADA'"  class="badge bg-success">Aprovada</span>
                    <span th:case="'RECHAZADA'" class="badge bg-danger">Rebutjada</span>
                    <span th:case="*" class="badge bg-secondary" th:text="${sol.estat}"></span>
                </span>
            </td>
            <td>
                <a th:href="@{/solicitudes/detalle/{id}(id=${sol.idRequest})}"
                   class="btn btn-sm btn-outline-primary">Veure detall</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(solicitudes)}">
            <td colspan="6" class="text-center text-muted py-3">No tens sol·licituds registrades.</td>
        </tr>
        </tbody>
    </table>

    <!-- Paginació -->
    <nav th:if="${totalPaginas > 1}" aria-label="Paginació">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/solicitudes/mis-solicitudes(q=${q}, dir=${dir}, page=${page - 1})}"
                   aria-label="Pàgina anterior">«</a>
            </li>
            <li class="page-item"
                th:each="p : ${#numbers.sequence(1, totalPaginas)}"
                th:classappend="${p == page} ? 'active'">
                <a class="page-link"
                   th:href="@{/solicitudes/mis-solicitudes(q=${q}, dir=${dir}, page=${p})}"
                   th:text="${p}"></a>
            </li>
            <li class="page-item" th:classappend="${page == totalPaginas} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/solicitudes/mis-solicitudes(q=${q}, dir=${dir}, page=${page + 1})}"
                   aria-label="Pàgina següent">»</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
