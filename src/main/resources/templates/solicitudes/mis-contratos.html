<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Els meus contractes - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">SgOVI</span>
    <div>
        <a href="/solicitudes/mis-solicitudes" class="btn btn-outline-light btn-sm me-2">Les meues sol·licituds</a>
        <a href="/solicitudes/mi-perfil" class="btn btn-outline-light btn-sm me-2">El meu perfil</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Sortir</a>
    </div>
</nav>
<main class="container mt-4">
    <h1 class="h3 mb-4">Els meus contractes</h1>

    <p class="text-muted" th:text="${total} + ' contracte(s)'">0</p>

    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>Tipus servei</th>
            <th>Assistent personal</th>
            <th>Data inici</th>
            <th>Data fi</th>
            <th>Estat</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${contratos}">
            <td>
                <span th:if="${tipusServei != null and #maps.containsKey(tipusServei, c.idSolicitud)}"
                      th:text="${tipusServei[c.idSolicitud]}"></span>
                <span th:unless="${tipusServei != null and #maps.containsKey(tipusServei, c.idSolicitud)}"
                      class="text-muted">—</span>
            </td>
            <td>
                <span th:if="${nombresAsistentes != null and nombresAsistentes[c.dniAsistente] != null}"
                      th:text="${nombresAsistentes[c.dniAsistente]}"></span>
                <span th:unless="${nombresAsistentes != null and nombresAsistentes[c.dniAsistente] != null}"
                      class="text-muted">Pendent d'assignació</span>
            </td>
            <td th:text="${c.fechaInicio}"></td>
            <td th:text="${c.fechaFin != null ? c.fechaFin : 'En curs'}"></td>
            <td>
                <span th:switch="${c.estadoContrato}">
                    <span th:case="'activo'" class="badge bg-success">Actiu</span>
                    <span th:case="'finalizado'" class="badge bg-secondary">Finalitzat</span>
                    <span th:case="'rescindido'" class="badge bg-danger">Rescindit</span>
                </span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(contratos)}">
            <td colspan="5" class="text-center text-muted">No tens cap contracte actiu.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPaginas > 1}" aria-label="Paginació">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/solicitudes/mis-contratos(page=${page - 1})}" aria-label="Anterior">«</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPaginas)}"
                th:classappend="${p == page} ? 'active'">
                <a class="page-link" th:href="@{/solicitudes/mis-contratos(page=${p})}" th:text="${p}"></a>
            </li>
            <li class="page-item" th:classappend="${page == totalPaginas} ? 'disabled'">
                <a class="page-link" th:href="@{/solicitudes/mis-contratos(page=${page + 1})}" aria-label="Següent">»</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
