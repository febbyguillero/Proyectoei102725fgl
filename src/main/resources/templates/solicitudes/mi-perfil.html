<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>El meu perfil - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">SgOVI</span>
    <div>
        <a href="/solicitudes/mis-solicitudes" class="btn btn-outline-light btn-sm me-2">Les meues sol·licituds</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Sortir</a>
    </div>
</nav>
<main class="container mt-4" style="max-width:700px">
    <h1 class="h3 mb-4">El meu perfil</h1>

    <div class="card">
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-4">Nom complet</dt>
                <dd class="col-sm-8" th:text="${usuario.nom + ' ' + usuario.cognoms}"></dd>
                <dt class="col-sm-4">DNI</dt>
                <dd class="col-sm-8" th:text="${usuario.dni}"></dd>
                <dt class="col-sm-4">Email</dt>
                <dd class="col-sm-8" th:text="${usuario.email}"></dd>
                <dt class="col-sm-4">Telèfon</dt>
                <dd class="col-sm-8" th:text="${usuario.telefon}"></dd>
                <dt class="col-sm-4">Adreça</dt>
                <dd class="col-sm-8" th:text="${usuario.adreca}"></dd>
                <dt class="col-sm-4">Identificador SgOVI</dt>
                <dd class="col-sm-8" th:text="${usuario.identificadorSgovi}"></dd>
            </dl>
            <a th:href="@{/solicitudes/editar-perfil}"
               class="btn btn-primary">Editar dades</a>
        </div>
    </div>
</main>
</body>
</html>
