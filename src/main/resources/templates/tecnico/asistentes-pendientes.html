<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Candidatos PAP/PATI - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar-tecnico :: navbar-tecnico}"></nav>
<main class="container mt-4">

    <h1>Gestión de Candidatos PAP/PATI</h1>

    <form method="get" th:action="@{/tecnico/asistentes-pendientes}" class="row g-2 mb-3" role="search">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="dir" th:value="${dir}">
        <div class="col-md-8">
            <label for="q" class="visually-hidden">Buscar por nombre, DNI, email o zona</label>
            <input type="text" id="q" name="q" th:value="${q}" class="form-control"
                   placeholder="Buscar por nombre, DNI, email o zona...">
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/tecnico/asistentes-pendientes}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>

    <p class="text-muted" th:text="${total} + ' asistente(s)'">0</p>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/asistentes-pendientes(q=${q}, sort='dni', dir=${sort == 'dni' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    DNI <span th:if="${sort == 'dni'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'dni'}">↕</span>
                </a>
            </th>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/asistentes-pendientes(q=${q}, sort='nombre', dir=${sort == 'nombre' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    Nombre <span th:if="${sort == 'nombre'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'nombre'}">↕</span>
                </a>
            </th>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/asistentes-pendientes(q=${q}, sort='email', dir=${sort == 'email' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    Email <span th:if="${sort == 'email'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'email'}">↕</span>
                </a>
            </th>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/asistentes-pendientes(q=${q}, sort='zona', dir=${sort == 'zona' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    Zona Geográfica <span th:if="${sort == 'zona'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'zona'}">↕</span>
                </a>
            </th>
            <th scope="col">Estado</th>
            <th scope="col">Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asistente : ${asistentes}">
            <td th:text="${asistente.dni}"></td>
            <td th:text="${asistente.nombre + ' ' + asistente.apellidos}"></td>
            <td th:text="${asistente.email}"></td>
            <td th:text="${asistente.zonaGeografica}"></td>
            <td>
                <span th:if="${asistente.estado == 'ACEPTADO'}" class="badge bg-success">Aceptado</span>
                <span th:if="${asistente.estado == 'PENDIENTE'}" class="badge bg-warning text-dark">Pendiente</span>
                <span th:if="${asistente.estado == 'RECHAZADO'}" class="badge bg-danger">Rechazado</span>
            </td>
            <td>
                <a th:if="${asistente.estado == 'PENDIENTE'}"
                   th:href="@{/tecnico/aceptar-asistente/{dni}(dni=${asistente.dni})}"
                   class="btn btn-sm btn-success">Aceptar</a>
                <a th:href="@{/tecnico/rechazar-asistente/{dni}(dni=${asistente.dni})}"
                   class="btn btn-sm btn-danger">Rechazar</a>
                <a th:href="@{/tecnico/editar-asistente/{dni}(dni=${asistente.dni})}"
                   class="btn btn-sm btn-warning">Editar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(asistentes)}">
            <td colspan="6" class="text-center text-muted">No hay asistentes que coincidan.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPaginas > 1}" aria-label="Paginación">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/tecnico/asistentes-pendientes(q=${q}, sort=${sort}, dir=${dir}, page=${page - 1})}" aria-label="Página anterior">«</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPaginas)}" th:classappend="${p == page} ? 'active'">
                <a class="page-link" th:href="@{/tecnico/asistentes-pendientes(q=${q}, sort=${sort}, dir=${dir}, page=${p})}" th:text="${p}"></a>
            </li>
            <li class="page-item" th:classappend="${page == totalPaginas} ? 'disabled'">
                <a class="page-link" th:href="@{/tecnico/asistentes-pendientes(q=${q}, sort=${sort}, dir=${dir}, page=${page + 1})}" aria-label="Página siguiente">»</a>
            </li>
        </ul>
    </nav>

</main>
</body>
</html>
