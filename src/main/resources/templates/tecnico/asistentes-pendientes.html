<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistentes Pendientes - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Asistentes Pendientes de Aceptación</h1>
<table class="table table-striped" th:unless="${#lists.isEmpty(asistentes)}">
    <thead><tr><th>DNI</th><th>Nombre</th><th>Email</th><th>Estado</th><th>Acción</th></tr></thead>
    <tbody>
    <tr th:each="a : ${asistentes}">
        <td th:text="${a.dni}"></td>
        <td th:text="${a.nombre + ' ' + a.apellidos}"></td>
        <td th:text="${a.email}"></td>
        <td><span th:class="${a.estado} ? 'badge bg-success' : 'badge bg-warning'" th:text="${a.estado} ? 'Aceptado' : 'Pendiente'"></span></td>
        <td><a th:if="${!a.estado}" th:href="@{/tecnico/aceptar-asistente/{dni}(dni=${a.dni})}" class="btn btn-sm btn-success">✅ Aceptar</a></td>
    </tr>
    </tbody>
</table>
<div th:if="${#lists.isEmpty(asistentes)}" class="alert alert-info">No hay asistentes registrados.</div>
<a th:href="@{/tecnico/panel}" class="btn btn-secondary">Volver al panel</a>
</body>
</html>
