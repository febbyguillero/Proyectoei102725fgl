<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contractes - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar-tecnico :: navbar-tecnico}"></nav>
<main class="container mt-4">
<h1>Gestió de Contractes</h1>

<form method="get" th:action="@{/tecnico/contratos}" class="row g-2 mb-3" role="search">
    <input type="hidden" name="sort" th:value="${sort}">
    <input type="hidden" name="dir" th:value="${dir}">
    <div class="col-md-8">
        <label for="q" class="visually-hidden">Cercar per nom d'assistent, usuari o estat</label>
        <input type="text" id="q" name="q" th:value="${q}" class="form-control"
               placeholder="Cercar per nom, assistent o estat...">
    </div>
    <div class="col-md-4">
        <button type="submit" class="btn btn-primary">Cercar</button>
        <a th:href="@{/tecnico/contratos}" class="btn btn-outline-secondary">Netejar</a>
    </div>
</form>

<p class="text-muted" th:text="${total} + ' contracte(s)'">0</p>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/tecnico/contratos(q=${q}, sort='id', dir=${sort == 'id' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                ID <span th:if="${sort == 'id'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'id'}">↕</span>
            </a>
        </th>
        <th scope="col">Usuari OVI</th>
        <th scope="col">Assistent PAP/PATI</th>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/tecnico/contratos(q=${q}, sort='inicio', dir=${sort == 'inicio' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                Inici <span th:if="${sort == 'inicio'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'inicio'}">↕</span>
            </a>
        </th>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/tecnico/contratos(q=${q}, sort='fin', dir=${sort == 'fin' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                Fi <span th:if="${sort == 'fin'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'fin'}">↕</span>
            </a>
        </th>
        <th scope="col">
            <a class="link-light text-decoration-none"
               th:href="@{/tecnico/contratos(q=${q}, sort='estado', dir=${sort == 'estado' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                Estat <span th:if="${sort == 'estado'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'estado'}">↕</span>
            </a>
        </th>
        <th scope="col">Accions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${contratos}">
        <td th:text="${c.idContrato}"></td>
        <td>
            <span th:if="${nombresUsuarios != null and nombresUsuarios[c.idSolicitud] != null}"
                  th:text="${nombresUsuarios[c.idSolicitud]}"></span>
            <span th:unless="${nombresUsuarios != null and nombresUsuarios[c.idSolicitud] != null}"
                  class="text-muted" th:text="'Sol·licitud #' + ${c.idSolicitud}"></span>
        </td>
        <td>
            <span th:if="${nombresAsistentes != null and nombresAsistentes[c.dniAsistente] != null}"
                  th:text="${nombresAsistentes[c.dniAsistente]}"></span>
            <span th:unless="${nombresAsistentes != null and nombresAsistentes[c.dniAsistente] != null}"
                  class="text-muted" th:text="${c.dniAsistente != null ? c.dniAsistente : '—'}"></span>
        </td>
        <td th:text="${c.fechaInicio}"></td>
        <td th:text="${c.fechaFin != null ? c.fechaFin : 'En curs'}"></td>
        <td>
            <span th:switch="${c.estadoContrato}">
                <span th:case="'activo'" class="badge bg-success">Actiu</span>
                <span th:case="'finalizado'" class="badge bg-secondary">Finalitzat</span>
                <span th:case="'rescindido'" class="badge bg-danger">Rescindit</span>
                <span th:case="*" class="badge bg-warning" th:text="${c.estadoContrato}"></span>
            </span>
        </td>
        <td>
            <a th:href="@{/tecnico/contrato/{id}/editar(id=${c.idContrato})}" class="btn btn-sm btn-warning">Editar</a>
            <a th:if="${c.estadoContrato == 'activo'}"
               th:href="@{/tecnico/contrato/{id}/cerrar(id=${c.idContrato})}"
               class="btn btn-sm btn-danger">Tancar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(contratos)}">
        <td colspan="7" class="text-center text-muted">No hi ha contractes que coincidisquen.</td>
    </tr>
    </tbody>
</table>

<nav th:if="${totalPaginas > 1}" aria-label="Paginació">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
            <a class="page-link" th:href="@{/tecnico/contratos(q=${q}, sort=${sort}, dir=${dir}, page=${page - 1})}" aria-label="Pàgina anterior">«</a>
        </li>
        <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPaginas)}" th:classappend="${p == page} ? 'active'">
            <a class="page-link" th:href="@{/tecnico/contratos(q=${q}, sort=${sort}, dir=${dir}, page=${p})}" th:text="${p}"></a>
        </li>
        <li class="page-item" th:classappend="${page == totalPaginas} ? 'disabled'">
            <a class="page-link" th:href="@{/tecnico/contratos(q=${q}, sort=${sort}, dir=${dir}, page=${page + 1})}" aria-label="Pàgina següent">»</a>
        </li>
    </ul>
</nav>

</main>
</body>
</html>
