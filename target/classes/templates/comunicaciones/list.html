<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Comunicacions - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container mt-4">

    <h1>Comunicacions de la Sol·licitud <span th:text="${solicitud.idRequest}"></span></h1>

    <div class="mb-3">
        <p class="text-muted">
            Tipus: <strong th:text="${solicitud.tipusServei}"></strong> |
            Estat:
            <span th:switch="${solicitud.estat}">
                <span th:case="'PENDIENTE'" class="badge bg-warning text-dark">PENDENT</span>
                <span th:case="'APROBADA'"  class="badge bg-success">APROVADA</span>
                <span th:case="'RECHAZADA'" class="badge bg-danger">REBUTJADA</span>
                <span th:case="*" class="badge bg-secondary" th:text="${solicitud.estat}"></span>
            </span>
        </p>
    </div>

    <a th:href="@{/comunicaciones/solicitud/{id}/add(id=${solicitud.idRequest})}"
       class="btn btn-primary mb-3">+ Registrar nova comunicació</a>

    <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(comunicaciones)}">
        <thead class="table-dark">
        <tr>
            <th scope="col">Data</th>
            <th scope="col">Tipus</th>
            <th scope="col">Direcció</th>
            <th scope="col">Assistent</th>
            <th scope="col">Resum</th>
            <th scope="col">Observacions</th>
            <th scope="col" th:if="${esTecnico}">Acció</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="com : ${comunicaciones}">
            <td th:text="${#temporals.format(com.fechaComunicacion, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${com.tipoComunicacion}"></td>
            <td>
                <span th:if="${com.direccion == 'saliente'}" class="badge bg-info text-dark">Eixint</span>
                <span th:if="${com.direccion == 'entrante'}" class="badge bg-secondary">Entrant</span>
            </td>
            <td>
                <!-- Mostra el nom si el controlador ha passat el mapa, si no el DNI -->
                <span th:if="${nombresAsistentes != null and com.dniAsistente != null and nombresAsistentes[com.dniAsistente] != null}"
                      th:text="${nombresAsistentes[com.dniAsistente]}"></span>
                <span th:unless="${nombresAsistentes != null and com.dniAsistente != null and nombresAsistentes[com.dniAsistente] != null}"
                      th:text="${com.dniAsistente != null ? com.dniAsistente : '-'}"></span>
            </td>
            <td th:text="${com.resumen}"></td>
            <td th:text="${com.observaciones != null ? com.observaciones : '-'}"></td>
            <td th:if="${esTecnico}">
                <a th:href="@{/comunicaciones/delete/{id}/solicitud/{sid}(id=${com.idComunicacion}, sid=${solicitud.idRequest})}"
                   class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(comunicaciones)}" class="alert alert-info">
        No hi ha comunicacions registrades per a aquesta sol·licitud.
    </div>

    <div class="mt-3">
        <a th:href="@{/tecnico/solicitud/{id}(id=${solicitud.idRequest})}"
           class="btn btn-secondary" th:if="${esTecnico}">Tornar al detall</a>
        <a th:href="@{/solicitudes/detalle/{id}(id=${solicitud.idRequest})}"
           class="btn btn-secondary" th:unless="${esTecnico}">Tornar al detall</a>
    </div>

</main>
</body>
</html>
