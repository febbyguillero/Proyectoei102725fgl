<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Comunicacions - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .msg-tecnico  { background: #e8f4fd; border-left: 4px solid #0d6efd; }
        .msg-usuario  { background: #f0fdf4; border-left: 4px solid #198754; }
        .msg-box { border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar-tecnico :: navbar-tecnico}" th:if="${esTecnico}"></nav>
<nav th:unless="${esTecnico}" class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">SgOVI</span>
    <div>
        <a href="/solicitudes/mis-solicitudes" class="btn btn-outline-light btn-sm me-2">Les meues sol·licituds</a>
        <a href="/solicitudes/mi-perfil" class="btn btn-outline-light btn-sm me-2">El meu perfil</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Sortir</a>
    </div>
</nav>

<main class="container mt-4" style="max-width: 720px">

    <h1 class="h4 mb-1">Comunicacions</h1>
    <p class="text-muted small mb-3">
        Sol·licitud #<span th:text="${solicitud.idRequest}"></span>
        — <span th:text="${solicitud.tipusServei}"></span>
        <span th:switch="${solicitud.estat}">
            <span th:case="'PENDIENTE'" class="badge bg-warning text-dark ms-1">Pendent</span>
            <span th:case="'APROBADA'"  class="badge bg-success ms-1">Aprovada</span>
            <span th:case="'RECHAZADA'" class="badge bg-danger ms-1">Rebutjada</span>
        </span>
    </p>

    <div th:if="${#lists.isEmpty(comunicaciones)}" class="alert alert-light border text-muted">
        Encara no hi ha missatges en aquesta sol·licitud.
    </div>

    <div th:each="com : ${comunicaciones}">
        <div th:classappend="${com.direccion == 'TECNICO'} ? 'msg-tecnico' : 'msg-usuario'"
             class="msg-box">
            <div class="d-flex justify-content-between align-items-start">
                <small class="fw-semibold">
                    <span th:if="${com.direccion == 'TECNICO'}">🔵 Tècnic OVI</span>
                    <span th:unless="${com.direccion == 'TECNICO'}">🟢 Usuari OVI</span>
                </small>
                <small class="text-muted"
                       th:text="${#temporals.format(com.fechaComunicacion, 'dd/MM/yyyy HH:mm')}"></small>
            </div>
            <p class="mb-1 mt-1" th:text="${com.resumen}"></p>
            <!-- Eliminar: només visible per al tècnic -->
            <div th:if="${esTecnico}" class="text-end">
                <a th:href="@{/comunicaciones/delete/{id}/solicitud/{sid}(id=${com.idComunicacion},sid=${solicitud.idRequest})}"
                   class="btn btn-outline-danger btn-sm py-0 px-2"
                   onclick="return confirm('Eliminar aquest missatge?')">✕</a>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h2 class="h6 mb-3">Escriu un missatge</h2>

            <div th:if="${errorText}" class="alert alert-danger py-2" th:text="${errorText}"></div>

            <form th:action="@{/comunicaciones/solicitud/{id}(id=${solicitud.idRequest})}"
                  method="post">
                <div class="mb-3">
                    <label for="text" class="visually-hidden">Missatge</label>
                    <textarea id="text" name="text" class="form-control" rows="3"
                              maxlength="500" required
                              placeholder="Escriu el teu missatge aquí..."></textarea>
                    <div class="form-text">Màxim 500 caràcters.</div>
                </div>
                <button type="submit" class="btn btn-primary">Enviar missatge</button>
            </form>
        </div>
    </div>

    <div class="mt-3">
        <a th:if="${esTecnico}"
           th:href="@{/tecnico/solicitud/{id}(id=${solicitud.idRequest})}"
           class="btn btn-secondary btn-sm">← Tornar al detall</a>
        <a th:unless="${esTecnico}"
           th:href="@{/solicitudes/detalle/{id}(id=${solicitud.idRequest})}"
           class="btn btn-secondary btn-sm">← Tornar al detall</a>
    </div>

</main>
</body>
</html>
