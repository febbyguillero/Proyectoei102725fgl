<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Tancar sessió - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container mt-5" style="max-width: 500px;">
    <div class="card">
        <div class="card-body text-center">
            <h1 class="h4 mb-3">Tancar sessió</h1>
            <p class="mb-4">Estàs segur que vols tancar la sessió?</p>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger me-2">Sí, tancar sessió</button>
            </form>
            <a th:href="@{/tecnico/panel}" class="btn btn-outline-secondary">Cancel·lar</a>
        </div>
    </div>
</main>
</body>
</html>
