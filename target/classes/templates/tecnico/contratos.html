<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contractes - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Gestió de Contractes</h1>

<div class="mb-3">
    <input type="text" id="busqueda" class="form-control" placeholder="Cercar per DNI, estat...">
</div>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th onclick="ordenarTabla(0)" style="cursor:pointer">ID ↕</th>
        <th onclick="ordenarTabla(1)" style="cursor:pointer">Sol·licitud ↕</th>
        <th onclick="ordenarTabla(2)" style="cursor:pointer">DNI Assistent ↕</th>
        <th onclick="ordenarTabla(3)" style="cursor:pointer">Inici ↕</th>
        <th onclick="ordenarTabla(4)" style="cursor:pointer">Fi ↕</th>
        <th onclick="ordenarTabla(5)" style="cursor:pointer">Estat ↕</th>
        <th>Accions</th>
    </tr>
    </thead>
    <tbody id="cuerpoTabla">
    <tr th:each="c : ${contratos}">
        <td th:text="${c.idContrato}"></td>
        <td th:text="${c.idSolicitud}"></td>
        <td th:text="${c.dniAsistente}"></td>
        <td th:text="${c.fechaInicio}"></td>
        <td th:text="${c.fechaFin != null ? c.fechaFin : 'En curs'}"></td>
        <td>
                <span th:switch="${c.estadoContrato}">
                    <span th:case="'activo'" class="badge bg-success">Actiu</span>
                    <span th:case="'finalizado'" class="badge bg-secondary">Finalitzat</span>
                    <span th:case="'rescindido'" class="badge bg-danger">Rescindit</span>
                    <span th:case="*" class="badge bg-warning" th:text="${c.estadoContrato}"></span>
                </span>
        </td>
        <td>
            <a th:href="@{/tecnico/contrato/{id}/editar(id=${c.idContrato})}"
               class="btn btn-sm btn-warning">Editar</a>
            <a th:if="${c.estadoContrato == 'activo'}"
               th:href="@{/tecnico/contrato/{id}/cerrar(id=${c.idContrato})}"
               class="btn btn-sm btn-danger"
               onclick="return confirm('Tancar aquest contracte?')">Tancar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(contratos)}">
        <td colspan="7" class="text-center text-muted">No hi ha contractes registrats.</td>
    </tr>
    </tbody>
</table>

<div id="paginacion" class="d-flex justify-content-center mt-3"></div>
<a th:href="@{/tecnico/panel}" class="btn btn-secondary mt-3">Tornar al panel</a>

<script>
    const FILAS_POR_PAGINA = 10;
    let paginaActual = 1;
    let filasBase = [];

    function inicializar() {
        filasBase = Array.from(document.querySelectorAll('#cuerpoTabla tr'));
        renderPagina();
    }
    function renderPagina() {
        const texto = document.getElementById('busqueda').value.toLowerCase();
        const filtradas = filasBase.filter(f => f.textContent.toLowerCase().includes(texto));
        const total = Math.ceil(filtradas.length / FILAS_POR_PAGINA);
        if (paginaActual > total) paginaActual = 1;
        filasBase.forEach(f => f.style.display = 'none');
        const inicio = (paginaActual - 1) * FILAS_POR_PAGINA;
        filtradas.slice(inicio, inicio + FILAS_POR_PAGINA).forEach(f => f.style.display = '');
        const pag = document.getElementById('paginacion');
        pag.innerHTML = '';
        for (let i = 1; i <= total; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = 'btn btn-sm mx-1 ' + (i === paginaActual ? 'btn-primary' : 'btn-outline-primary');
            btn.onclick = () => { paginaActual = i; renderPagina(); };
            pag.appendChild(btn);
        }
    }
    document.getElementById('busqueda').addEventListener('input', () => { paginaActual = 1; renderPagina(); });
    let ordenAsc = true;
    function ordenarTabla(col) {
        const tbody = document.getElementById('cuerpoTabla');
        const filas = Array.from(tbody.querySelectorAll('tr'));
        filas.sort((a, b) => {
            const va = a.cells[col]?.textContent.trim() || '';
            const vb = b.cells[col]?.textContent.trim() || '';
            return ordenAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        ordenAsc = !ordenAsc;
        filas.forEach(f => tbody.appendChild(f));
        filasBase = filas;
        renderPagina();
    }
    window.onload = inicializar;
</script>
</body>
</html>
