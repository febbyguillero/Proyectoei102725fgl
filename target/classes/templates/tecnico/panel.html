<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Técnico - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Panel del Técnico OVI</h1>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h5>📋 Solicitudes de Asistencia</h5>
                <a th:href="@{/tecnico/solicitudes}" class="btn btn-primary">Ver Solicitudes</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h5>👤 Asistentes Pendientes</h5>
                <a th:href="@{/tecnico/asistentes-pendientes}" class="btn btn-warning">Ver Asistentes</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h5>👥 Usuarios Pendientes</h5>
                <a th:href="@{/tecnico/usuarios-pendientes}" class="btn btn-success">Ver Usuarios</a>
            </div>
        </div>
    </div>
</div>
<a href="/" class="btn btn-secondary mt-3">Volver al inicio</a>
</body>
</html>
