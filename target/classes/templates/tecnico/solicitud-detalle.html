<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Solicitud - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Detalle de Solicitud #<span th:text="${solicitud.idRequest}"></span></h1>
<div class="card mb-4">
    <div class="card-body">
        <p><strong>Usuario:</strong> <span th:text="${solicitud.usuariIdent}"></span></p>
        <p><strong>Tipo:</strong> <span th:text="${solicitud.tipusServei}"></span></p>
        <p><strong>Fecha:</strong> <span th:text="${#temporals.format(solicitud.dataCreacio, 'dd/MM/yyyy')}"></span></p>
        <p><strong>Estado:</strong> <span class="badge bg-success" th:text="${solicitud.estat}"></span></p>
        <p><strong>Observaciones:</strong> <span th:text="${solicitud.observations}"></span></p>
    </div>
</div>
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<h2>Candidatos Propuestos</h2>
<table class="table table-striped" th:if="${candidatosPropuestos != null and !candidatosPropuestos.isEmpty()}">
    <thead><tr><th>DNI</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Titulación</th></tr></thead>
    <tbody>
    <tr th:each="c : ${candidatosPropuestos}">
        <td th:text="${c.dni}"></td>
        <td th:text="${c.nombre + ' ' + c.apellidos}"></td>
        <td th:text="${c.email}"></td>
        <td th:text="${c.telefono}"></td>
        <td th:text="${c.titulacion}"></td>
    </tr>
    </tbody>
</table>
<div th:unless="${candidatosPropuestos != null and !candidatosPropuestos.isEmpty()}" class="alert alert-warning">
    No se encontraron candidatos aptos en la misma zona.
</div>
<a th:href="@{/tecnico/solicitudes}" class="btn btn-secondary mt-3">Volver a solicitudes</a>
</body>
</html>
