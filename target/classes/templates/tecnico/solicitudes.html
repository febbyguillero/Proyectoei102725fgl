<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitudes - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1>Solicitudes de Asistencia Personal</h1>

<!-- Filtros -->
<div class="row mb-3">
    <div class="col-md-6">
        <input type="text" id="busqueda" class="form-control" placeholder="Buscar por usuario, tipo, criterios...">
    </div>
    <div class="col-md-3">
        <select id="filtroEstado" class="form-select">
            <option value="">Todos los estados</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="APROBADA">Aprobada</option>
            <option value="RECHAZADA">Rechazada</option>
            <option value="EN_REVISIO">En revisión</option>
        </select>
    </div>
    <div class="col-md-3">
        <select id="filtroTipo" class="form-select">
            <option value="">Todos los tipos</option>
            <option value="PAP">PAP</option>
            <option value="PATI">PATI</option>
        </select>
    </div>
</div>

<table class="table table-striped table-hover" id="tablaSolicitudes">
    <thead class="table-dark">
        <tr>
            <th onclick="ordenarTabla(0)" style="cursor:pointer">ID ↕</th>
            <th onclick="ordenarTabla(1)" style="cursor:pointer">Usuario ↕</th>
            <th onclick="ordenarTabla(2)" style="cursor:pointer">Tipo ↕</th>
            <th onclick="ordenarTabla(3)" style="cursor:pointer">Criterios</th>
            <th onclick="ordenarTabla(4)" style="cursor:pointer">Fecha ↕</th>
            <th onclick="ordenarTabla(5)" style="cursor:pointer">Estado ↕</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody id="cuerpoTabla">
        <tr th:each="sol : ${solicitudes}">
            <td th:text="${sol.idRequest}"></td>
            <!-- Nombre del usuario en vez del ID -->
            <td th:text="${nombresUsuarios != null and nombresUsuarios[sol.usuariIdent] != null}
                         ? ${nombresUsuarios[sol.usuariIdent]}
                         : ${sol.usuariIdent}"></td>
            <td th:text="${sol.tipusServei}"></td>
            <!-- Criterios: días y franja horaria -->
            <td>
                <span th:if="${sol.dies != null and !sol.dies.isEmpty()}"
                      th:text="'Días: ' + ${sol.dies}"></span>
                <span th:if="${sol.franjaHoraria != null and !sol.franjaHoraria.isEmpty()}"
                      th:text="' | ' + ${sol.franjaHoraria}"></span>
            </td>
            <td th:text="${sol.dataCreacio}"></td>
            <td>
                <span th:switch="${sol.estat}">
                    <span th:case="'PENDIENTE'" class="badge bg-warning text-dark">PENDIENTE</span>
                    <span th:case="'APROBADA'" class="badge bg-success">APROBADA</span>
                    <span th:case="'RECHAZADA'" class="badge bg-danger">RECHAZADA</span>
                    <span th:case="'EN_REVISIO'" class="badge bg-info text-dark">EN REVISIÓN</span>
                    <span th:case="*" class="badge bg-secondary" th:text="${sol.estat}"></span>
                </span>
            </td>
            <td>
                <a th:href="@{/tecnico/solicitud/{id}(id=${sol.idRequest})}" class="btn btn-sm btn-primary">Revisar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(solicitudes)}">
            <td colspan="7" class="text-center text-muted">No hay solicitudes.</td>
        </tr>
    </tbody>
</table>

<div id="paginacion" class="d-flex justify-content-center mt-3"></div>
<a th:href="@{/tecnico/panel}" class="btn btn-secondary mt-3">Volver al panel</a>

<script>
const FILAS_POR_PAGINA = 10;
let paginaActual = 1;
let filasBase = [];

function inicializar() {
    filasBase = Array.from(document.querySelectorAll('#cuerpoTabla tr'));
    renderPagina();
}

function filasFiltradas() {
    const texto = document.getElementById('busqueda').value.toLowerCase();
    const estado = document.getElementById('filtroEstado').value.toLowerCase();
    const tipo = document.getElementById('filtroTipo').value.toLowerCase();
    return filasBase.filter(fila => {
        const t = fila.textContent.toLowerCase();
        return t.includes(texto)
            && (estado === '' || t.includes(estado))
            && (tipo === '' || t.includes(tipo));
    });
}

function renderPagina() {
    const filtradas = filasFiltradas();
    const total = Math.ceil(filtradas.length / FILAS_POR_PAGINA);
    if (paginaActual > total) paginaActual = 1;

    filasBase.forEach(f => f.style.display = 'none');
    const inicio = (paginaActual - 1) * FILAS_POR_PAGINA;
    filtradas.slice(inicio, inicio + FILAS_POR_PAGINA).forEach(f => f.style.display = '');

    const pag = document.getElementById('paginacion');
    pag.innerHTML = '';
    for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = 'btn btn-sm mx-1 ' + (i === paginaActual ? 'btn-primary' : 'btn-outline-primary');
        btn.onclick = () => { paginaActual = i; renderPagina(); };
        pag.appendChild(btn);
    }
}

document.getElementById('busqueda').addEventListener('input', () => { paginaActual = 1; renderPagina(); });
document.getElementById('filtroEstado').addEventListener('change', () => { paginaActual = 1; renderPagina(); });
document.getElementById('filtroTipo').addEventListener('change', () => { paginaActual = 1; renderPagina(); });

let ordenAsc = true;
function ordenarTabla(col) {
    const tbody = document.getElementById('cuerpoTabla');
    const filas = Array.from(tbody.querySelectorAll('tr'));
    filas.sort((a, b) => {
        const va = a.cells[col]?.textContent.trim() || '';
        const vb = b.cells[col]?.textContent.trim() || '';
        return ordenAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    ordenAsc = !ordenAsc;
    filas.forEach(f => tbody.appendChild(f));
    filasBase = filas;
    renderPagina();
}

window.onload = inicializar;
</script>

</body>
</html>
