<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios OVI - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar-tecnico :: navbar-tecnico}"></nav>
<main class="container mt-4">

    <h1>Gestión de Usuarios OVI</h1>

    <form method="get" th:action="@{/tecnico/usuarios-pendientes}" class="row g-2 mb-3" role="search">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="dir" th:value="${dir}">
        <div class="col-md-8">
            <label for="q" class="visually-hidden">Buscar por nombre, email o DNI</label>
            <input type="text" id="q" name="q" th:value="${q}" class="form-control"
                   placeholder="Buscar por nombre, email o DNI...">
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/tecnico/usuarios-pendientes}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>

    <p class="text-muted" th:text="${total} + ' usuario(s)'">0</p>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/usuarios-pendientes(q=${q}, sort='id', dir=${sort == 'id' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    ID <span th:if="${sort == 'id'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'id'}">↕</span>
                </a>
            </th>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/usuarios-pendientes(q=${q}, sort='nom', dir=${sort == 'nom' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    Nombre <span th:if="${sort == 'nom'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'nom'}">↕</span>
                </a>
            </th>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/usuarios-pendientes(q=${q}, sort='email', dir=${sort == 'email' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    Email <span th:if="${sort == 'email'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'email'}">↕</span>
                </a>
            </th>
            <th scope="col">
                <a class="link-light text-decoration-none"
                   th:href="@{/tecnico/usuarios-pendientes(q=${q}, sort='dni', dir=${sort == 'dni' and dir == 'asc' ? 'desc' : 'asc'}, page=1)}">
                    DNI <span th:if="${sort == 'dni'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span><span th:unless="${sort == 'dni'}">↕</span>
                </a>
            </th>
            <th scope="col">Estado</th>
            <th scope="col">Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.idUsuari}"></td>
            <td th:text="${usuario.nom + ' ' + usuario.cognoms}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.dni}"></td>
            <td>
                <span th:if="${usuario.estatTecnicAcceptat}" class="badge bg-success">Aceptado</span>
                <span th:unless="${usuario.estatTecnicAcceptat}" class="badge bg-warning text-dark">Pendiente</span>
            </td>
            <td>
                <a th:unless="${usuario.estatTecnicAcceptat}"
                   th:href="@{/tecnico/aceptar-usuario/{id}(id=${usuario.idUsuari})}"
                   class="btn btn-sm btn-success">Aceptar</a>
                <a th:href="@{/tecnico/rechazar-usuario/{id}(id=${usuario.idUsuari})}"
                   class="btn btn-sm btn-danger">Rechazar</a>
                <a th:href="@{/tecnico/editar-usuario/{id}(id=${usuario.idUsuari})}"
                   class="btn btn-sm btn-warning">Editar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="6" class="text-center text-muted">No hay usuarios que coincidan.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPaginas > 1}" aria-label="Paginación">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/tecnico/usuarios-pendientes(q=${q}, sort=${sort}, dir=${dir}, page=${page - 1})}" aria-label="Página anterior">«</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPaginas)}" th:classappend="${p == page} ? 'active'">
                <a class="page-link" th:href="@{/tecnico/usuarios-pendientes(q=${q}, sort=${sort}, dir=${dir}, page=${p})}" th:text="${p}"></a>
            </li>
            <li class="page-item" th:classappend="${page == totalPaginas} ? 'disabled'">
                <a class="page-link" th:href="@{/tecnico/usuarios-pendientes(q=${q}, sort=${sort}, dir=${dir}, page=${page + 1})}" aria-label="Página siguiente">»</a>
            </li>
        </ul>
    </nav>

</main>
</body>
</html>
