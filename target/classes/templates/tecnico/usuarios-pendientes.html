<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios Pendientes - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Usuarios Pendientes de Aceptación</h1>
<table class="table table-striped" th:unless="${#lists.isEmpty(usuarios)}">
    <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>DNI</th><th>Estado</th><th>Acción</th></tr></thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.idUsuari}"></td>
        <td th:text="${u.nom + ' ' + u.cognoms}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.dni}"></td>
        <td><span th:class="${u.estatTecnicAcceptat} ? 'badge bg-success' : 'badge bg-warning'" th:text="${u.estatTecnicAcceptat} ? 'Aceptado' : 'Pendiente'"></span></td>
        <td><a th:unless="${u.estatTecnicAcceptat}" th:href="@{/tecnico/aceptar-usuario/{id}(id=${u.idUsuari})}" class="btn btn-sm btn-success">✅ Aceptar</a></td>
    </tr>
    </tbody>
</table>
<div th:if="${#lists.isEmpty(usuarios)}" class="alert alert-info">No hay usuarios registrados.</div>
<a th:href="@{/tecnico/panel}" class="btn btn-secondary">Volver al panel</a>
</body>
</html>
