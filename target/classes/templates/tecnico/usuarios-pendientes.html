<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios Pendientes - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1>Usuarios Pendientes de Aceptación</h1>

<div class="mb-3">
    <label for="busqueda" class="visually-hidden">Buscar por nombre, DNI o email</label>
    <input type="text" id="busqueda" class="form-control" placeholder="Buscar por nombre, DNI o email...">
</div>

<table class="table table-striped table-hover" id="tablaUsuarios">
    <thead class="table-dark">
        <tr>
            <th onclick="ordenarTabla(0)" style="cursor:pointer">ID ↕</th>
            <th onclick="ordenarTabla(1)" style="cursor:pointer">Nombre ↕</th>
            <th onclick="ordenarTabla(2)" style="cursor:pointer">Email ↕</th>
            <th onclick="ordenarTabla(3)" style="cursor:pointer">DNI ↕</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody id="cuerpoTabla">
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.idUsuari}"></td>
            <td th:text="${usuario.nom + ' ' + usuario.cognoms}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.dni}"></td>
            <td>
                <span th:if="${usuario.estatTecnicAcceptat}" class="badge bg-success">Aceptado</span>
                <span th:unless="${usuario.estatTecnicAcceptat}" class="badge bg-warning text-dark">Pendiente</span>
            </td>
            <td>
                <a th:unless="${usuario.estatTecnicAcceptat}"
                   th:href="@{/tecnico/aceptar-usuario/{id}(id=${usuario.idUsuari})}"
                   class="btn btn-sm btn-success">Aceptar</a>
                <a th:href="@{/tecnico/rechazar-usuario/{id}(id=${usuario.idUsuari})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Seguro que quieres rechazar este usuario?')">Rechazar</a>
                <a th:href="@{/tecnico/editar-usuario/{id}(id=${usuario.idUsuari})}"
                   class="btn btn-sm btn-warning">Editar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="6" class="text-center text-muted">No hay usuarios pendientes.</td>
        </tr>
    </tbody>
</table>

<div id="paginacion" class="d-flex justify-content-center mt-3"></div>
<a th:href="@{/tecnico/panel}" class="btn btn-secondary mt-3">Volver al panel</a>

<script>
const FILAS_POR_PAGINA = 10;
let paginaActual = 1;
let filasBase = [];

function inicializar() {
    filasBase = Array.from(document.querySelectorAll('#cuerpoTabla tr'));
    renderPagina();
}

function renderPagina() {
    const texto = document.getElementById('busqueda').value.toLowerCase();
    const filtradas = filasBase.filter(f => f.textContent.toLowerCase().includes(texto));
    const total = Math.ceil(filtradas.length / FILAS_POR_PAGINA);
    if (paginaActual > total) paginaActual = 1;

    filasBase.forEach(f => f.style.display = 'none');
    const inicio = (paginaActual - 1) * FILAS_POR_PAGINA;
    filtradas.slice(inicio, inicio + FILAS_POR_PAGINA).forEach(f => f.style.display = '');

    const pag = document.getElementById('paginacion');
    pag.innerHTML = '';
    for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = 'btn btn-sm mx-1 ' + (i === paginaActual ? 'btn-primary' : 'btn-outline-primary');
        btn.onclick = () => { paginaActual = i; renderPagina(); };
        pag.appendChild(btn);
    }
}

document.getElementById('busqueda').addEventListener('input', () => { paginaActual = 1; renderPagina(); });

let ordenAsc = true;
function ordenarTabla(col) {
    const tbody = document.getElementById('cuerpoTabla');
    const filas = Array.from(tbody.querySelectorAll('tr'));
    filas.sort((a, b) => {
        const va = a.cells[col]?.textContent.trim() || '';
        const vb = b.cells[col]?.textContent.trim() || '';
        return ordenAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    ordenAsc = !ordenAsc;
    filas.forEach(f => tbody.appendChild(f));
    filasBase = filas;
    renderPagina();
}

window.onload = inicializar;
</script>

</body>
</html>
