<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Candidats PAP/PATI - SgOVI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar-tecnico :: navbar-tecnico}"></nav>
<main class="container mt-4">
    <h1>Candidats PAP/PATI</h1>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>DNI</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Zona geogràfica</th>
            <th>Estat</th>
            <th>Accions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asistente : ${asistentes}">
            <td th:text="${asistente.dni}"></td>
            <td th:text="${asistente.nombre + ' ' + asistente.apellidos}"></td>
            <td th:text="${asistente.email}"></td>
            <td th:text="${asistente.zonaGeografica}"></td>
            <td>
                <span th:if="${asistente.estado == 'ACEPTADO'}" class="badge bg-success">Acceptat</span>
                <span th:if="${asistente.estado == 'PENDIENTE'}" class="badge bg-warning text-dark">Pendent</span>
                <span th:if="${asistente.estado == 'RECHAZADO'}" class="badge bg-danger">Rebutjat</span>
            </td>
            <td>
                <a th:href="@{/tecnico/editar-asistente/{dni}(dni=${asistente.dni})}"
                   class="btn btn-sm btn-warning">Editar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(asistentes)}">
            <td colspan="6" class="text-center text-muted">No hi ha candidats registrats.</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/tecnico/asistentes-pendientes}" class="btn btn-secondary">Tornar a la gestió</a>
</main>
</body>
</html>
